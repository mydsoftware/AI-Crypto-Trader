name: PACT-OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt
      - name: اجرای تست‌ها
        run: python -m unittest discover -s tests -v
